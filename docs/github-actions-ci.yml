# CI definition. Ship this file as docs/github-actions-ci.yml because the
# GitHub App used to publish this repo lacks the Workflows permission, so
# the workflow activates by moving this file to .github/workflows/ci.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: PYTHONPATH=src python -m pytest tests/ -q
      - name: Run demo
        run: PYTHONPATH=src python scripts/demo.py
